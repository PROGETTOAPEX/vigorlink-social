<!doctype html><html lang="it"><head><meta charset="utf-8"><style>
@font-face{font-family:Plate;src:url(fonts/Archivo-ExpandedBlack.ttf)}
@font-face{font-family:DM;src:url(fonts/DMSans.ttf);font-weight:100 1000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
#s{position:relative;width:1080px;height:1350px;overflow:hidden;background:#000;font-family:DM,sans-serif;color:#fff}
.glow{position:absolute;left:50%;top:860px;width:1500px;height:1100px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,106,19,.34),rgba(255,106,19,.1) 55%,rgba(255,106,19,0) 100%)}
.txt{position:absolute;left:84px;right:60px;top:96px}
.t{font:400 70px/1 Plate;text-transform:uppercase;letter-spacing:-.02em}
.t span{color:#FF6A13}
.b{margin-top:26px;max-width:860px;font:500 37px/1.3 DM;color:#cfcfcf}
.n{position:absolute;right:56px;top:46px;font:700 26px DM;letter-spacing:.06em;opacity:.55}
.scene{position:absolute;left:0;top:0;width:1080px;height:1350px;perspective:2600px}
.laptop{position:absolute;transform-style:preserve-3d}
.lid{position:relative;background:#0c0c0d;border-radius:26px 26px 6px 6px;padding:16px 16px 18px;box-shadow:0 0 0 2px #3a3a3c,0 60px 120px rgba(0,0,0,.75)}
.lid img{display:block;width:100%;border-radius:10px}
.cam{position:absolute;left:50%;top:5px;width:7px;height:7px;border-radius:50%;background:#2a2a2c;transform:translateX(-50%)}
.base{position:relative;height:26px;margin:0 -44px;background:linear-gradient(#c9c9cd,#8d8d92 55%,#55555a);border-radius:4px 4px 26px 26px;box-shadow:0 40px 60px rgba(0,0,0,.7)}
.base:before{content:"";position:absolute;left:50%;top:0;width:170px;height:9px;transform:translateX(-50%);background:#77777c;border-radius:0 0 10px 10px}
.phone{position:absolute;background:#0c0c0d;border-radius:54px;padding:11px;box-shadow:0 0 0 2px #4a4a4d,0 50px 100px rgba(0,0,0,.8),-30px 30px 80px rgba(0,0,0,.55)}
.phone .scr{position:relative;overflow:hidden;border-radius:44px}.phone img{display:block;width:100%}
.floor{position:absolute;left:90px;right:90px;top:1228px;height:60px;background:radial-gradient(closest-side,rgba(0,0,0,.85),rgba(0,0,0,0));filter:blur(6px)}
.lt .lid{box-shadow:0 0 0 2px #3a3a3c,0 40px 70px rgba(60,40,20,.28)}.lt .base{box-shadow:0 26px 40px rgba(60,40,20,.25)}.lt .phone{box-shadow:0 0 0 2px #4a4a4d,0 36px 70px rgba(60,40,20,.35),-20px 24px 50px rgba(60,40,20,.22)}.lt .floor{background:radial-gradient(closest-side,rgba(60,40,20,.28),rgba(60,40,20,0))}.lt .glow{background:radial-gradient(closest-side,rgba(255,106,19,.30),rgba(255,106,19,.08) 55%,rgba(255,106,19,0) 100%)}
</style></head><body><div id="s"></div><script>
const W=1080,H=1350,O='#FF6A13'
function plate(cx,cy,R,rot,dark){const c1=dark?'#141414':'#EE5F0C',c2=dark?'#1d1d1d':'#FF7E33',tx=dark?'#242424':'#E2560A'
return `<svg width="${W}" height="${H}" style="position:absolute;left:0;top:0"><g transform="rotate(${rot} ${cx} ${cy})"><circle cx="${cx}" cy="${cy}" r="${R}" fill="${c1}"/><circle cx="${cx}" cy="${cy}" r="${R*.93}" fill="none" stroke="${c2}" stroke-width="${R*.02}"/><circle cx="${cx}" cy="${cy}" r="${R*.58}" fill="none" stroke="${c2}" stroke-width="${R*.02}"/><circle cx="${cx}" cy="${cy}" r="${R*.3}" fill="${c2}"/><circle cx="${cx}" cy="${cy}" r="${R*.085}" fill="${dark?'#000':O}"/><path id="pp" d="M ${cx-R*.69} ${cy} a ${R*.69} ${R*.69} 0 1 1 ${R*1.38} 0 a ${R*.69} ${R*.69} 0 1 1 ${-R*1.38} 0" fill="none"/><text font-family="Plate" font-size="${R*.15}" fill="${tx}" letter-spacing="2"><textPath href="#pp" textLength="${2*Math.PI*R*.69*.985}">VIGORLINK  •  25 KG  •  CONNECT. TRAIN. PROGRESS.  •  25 KG  •  </textPath></text></g></svg>`}
function plateL(cx,cy,R,rot){return plate(cx,cy,R,rot,false).replace(/#EE5F0C/g,'#E9E3D9').replace(/#FF7E33/g,'#DED6CA').replace(/#E2560A/g,'#D8CFC1').replace(/fill="#FF6A13"/g,'fill="#F3EFE8"')}
window.show=(s,i,n)=>{const L=s.laptop,P=s.phone,P2=s.phone2,LT=s.bg==='light',len=Math.max(...s.t.map(x=>x.replace(/<[^>]+>/g,'').length)),fs=Math.min(70,Math.floor(920/(len*0.70)))
 document.getElementById('s').className=LT?'lt':'';document.getElementById('s').innerHTML=`<div style="position:absolute;inset:0;background:${LT?'#F3EFE8':'#000'}">${LT?plateL(980,1330,430,10):plate(980,1330,430,10,true)}</div><div class="glow"></div><div class="txt" style="color:${LT?'#000':'#fff'}"><div class="t" style="font-size:${fs}px">${s.t.map(x=>`<div>${x}</div>`).join('')}</div><div class="b" style="color:${LT?'#3a3a3a':'#cfcfcf'}">${s.b}</div></div>
 <div class="scene"><div class="floor"></div>
 ${L?`<div class="laptop" style="left:${L.x}px;top:${L.y}px;width:${L.w}px;transform:rotateY(${L.ry||0}deg) rotateX(${L.rx||0}deg) rotateZ(${L.rz||0}deg)"><div class="lid"><div class="cam"></div>${L.crop?`<div style="position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;border-radius:10px;background:#f3f4f6"><img src="${L.img}" style="position:absolute;max-width:none;border-radius:0;width:${L.iw*(L.w-32)/L.crop[2]}px;left:${-L.crop[0]*(L.w-32)/L.crop[2]}px;top:${-L.crop[1]*(L.w-32)/L.crop[2]}px"></div>`:`<img src="${L.img}">`}</div><div class="base"></div></div>`:''}
 ${P?`<div class="phone" style="left:${P.x}px;top:${P.y}px;width:${P.w}px;transform:rotateY(${P.ry||0}deg) rotateX(${P.rx||0}deg) rotateZ(${P.rz||0}deg)"><div class="scr" style="${P.h?`height:${P.h}px`:''}"><img src="${P.img}" style="margin-top:${-(P.oy||0)}px"></div></div>`:''}
 ${P2?`<div class="phone" style="left:${P2.x}px;top:${P2.y}px;width:${P2.w}px;transform:rotateY(${P2.ry||0}deg) rotateX(${P2.rx||0}deg) rotateZ(${P2.rz||0}deg)"><div class="scr" style="${P2.h?`height:${P2.h}px`:''}"><img src="${P2.img}" style="margin-top:${-(P2.oy||0)}px"></div></div>`:''}
 ${(s.pops||[]).map(q=>{const [bx,by,bw,bh]=q.box,z=q.z||1.6;return `<div style="position:absolute;left:${q.x}px;top:${q.y}px;width:${bw*z}px;height:${bh*z}px;border-radius:${(q.r||22)*z}px;overflow:hidden;box-shadow:0 0 0 3px rgba(255,106,19,.9),0 30px 70px rgba(0,0,0,.75);transform:rotateZ(${q.rz||0}deg)"><img src="${q.img}" style="position:absolute;max-width:none;width:${q.iw*z}px;left:${-bx*z}px;top:${-by*z}px"></div>`}).join('')}
 </div><div class="n" style="color:${LT?'#000':'#fff'}">${i}/${n}</div>`
 return Promise.all([...document.images].map(m=>m.decode().catch(()=>{})))}
document.fonts.ready.then(()=>document.body.dataset.ready='1')
</script></body></html>
